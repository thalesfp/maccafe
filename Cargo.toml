[package]
name = "maccafe"
version = "0.1.0"
edition = "2024"
description = "Keep a Mac awake from the command line"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
